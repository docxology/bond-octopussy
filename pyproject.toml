# OCTOPUSSY — FABERGÉ : special-agent mission software (BOND suite film package)
# Package-local configuration. Nothing is inherited from a workspace root: ruff,
# mypy and pytest read this file (or their defaults), and the tables at the end
# are the effective settings.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octopussy"
version = "0.1.0"
license = {text = "MIT"}
description = "Octopussy: FABERGÉ — artifact forgery detection, circus-cover logistics, and concealed-device sweep (BOND film package)"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

[tool.uv.sources]
# FROZEN protocol dependency: bond-api is Layer 1 of the BOND suite and must be
# resolvable from this film package. `uv sync --extra dev` before pytest.
bond-api = { path = "vendor/bond-api" }

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# >=90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy settings. mypy reads the nearest config and does not merge
# a workspace root's, so `mypy src/ scripts/` uses these values (or mypy's
# defaults) and nothing else.
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.uv]

[tool.ruff]
# This table is the effective configuration. Ruff selects the nearest config
# file and does not merge a workspace one, so a value not stated here is ruff's
# default, not a parent's — the neighbouring tables in this file are the whole
# story. line-length = 120 is the width this tree is already written to
# (measured 2026-11-04: at 120, 41 of 41 files are already formatted; at the
# default 88, 23 would be reformatted).
line-length = 120
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]

# Domain profile — Octopussy: FABERGÉ
# Advisory controls only; used as validation inputs for agentic-research gates.

domain: "special-agent investigation software (BOND film package)"
film: "Octopussy (1983)"
mission_codename: "FABERGÉ"

concepts:
  - "artifact forgery detection (spectral/UV fingerprinting)"
  - "circus-cover smuggling logistics (min-cost flow)"
  - "concealed nuclear device detection sweep (radiation, shape/mass anomaly)"

review_gates:
  - "pytest --cov=src --cov-fail-under=90"
  - "ruff check + ruff format clean"
  - "mypy clean on src/ and scripts/"
  - "no mock frameworks; deterministic fixed-seed computation"

source_policy:
  deterministic_scenarios: true
  no_external_runtime_data: true
  real_data_principle: "all numeric claims are computed or measured, never invented"

artifact_expectations:
  figures: ["forgery_fingerprints.png", "rail_network.png", "sweep_heatmap.png"]
  manuscript_variables_resolved: true
  mission_outcome_json: true

benchmark_rubric:
  primary_metric: "forgery disposition consistency across seeds"
  deterministic_seed: 7
